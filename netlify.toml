# Optional: host the frontend on Netlify and the API elsewhere (e.g. the Render service).
# Replace the API host below. Browser calls stay on the Netlify domain, so no CORS setup is needed.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://beacon-pulse.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
